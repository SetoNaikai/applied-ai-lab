name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:   # manual: the paid eval job below only ever runs this way

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,evals]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy libs
      - name: Unit tests (no network, no paid APIs)
        run: pytest -v -m "not slow and not costs_money and not eval"

  evals:
    name: Eval regression gate (manual, optional)
    runs-on: ubuntu-latest
    # LOCAL-FIRST: the real eval gate runs on the lab machine against the
    # local gateway (`make eval`), where inference is free. This cloud job is
    # OPT-IN (manual trigger only) and requires a paid ANTHROPIC_API_KEY repo
    # secret -- it exists for the day frontier-vs-local comparison runs are
    # wanted in CI, and is never part of the push/PR path.
    if: github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lab
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATABASE_URL: postgresql://lab:postgres@localhost:5432/lab
      MAX_COST_PER_EVAL_SUITE: "5.00"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev,evals,retrieval]"
      - name: Apply schema
        run: |
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -f sql/init/01-schema.sql
      # NOTE: this gate is here to fail. Do not loosen a threshold to make a
      # build green -- fix the regression, or document in an ADR why the
      # threshold was wrong in the first place.
      - name: Full eval suite
        run: pytest -v -m eval
