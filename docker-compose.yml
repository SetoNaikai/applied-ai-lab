name: ai-lab

services:
  ollama:
    image: ollama/ollama:0.5.7
    container_name: ollama
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped
    # NVIDIA GPU passthrough — uncomment if applicable:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports: ["3000:8080"]
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes: ["open-webui:/app/backend/data"]
    depends_on: [ollama]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: changeme_locally
      POSTGRES_DB: lab
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: qdrant
    ports: ["6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]
    restart: unless-stopped

# Langfuse: self-hosting requirements changed in v3 (adds ClickHouse, Redis,
# S3-compatible storage). Check https://langfuse.com/self-hosting before
# uncommenting, and pin a version rather than using :latest.
#
#  langfuse-db:
#    image: postgres:16
#    environment:
#      POSTGRES_USER: langfuse
#      POSTGRES_PASSWORD: changeme_locally
#      POSTGRES_DB: langfuse
#    volumes: ["langfusedb:/var/lib/postgresql/data"]
#
#  langfuse:
#    image: langfuse/langfuse:2
#    ports: ["3001:3000"]
#    environment:
#      DATABASE_URL: postgresql://langfuse:changeme_locally@langfuse-db:5432/langfuse
#      NEXTAUTH_URL: http://localhost:3001
#      NEXTAUTH_SECRET: replace_with_long_random_string
#      SALT: replace_with_another_long_random_string
#      TELEMETRY_ENABLED: "false"
#    depends_on: [langfuse-db]

volumes:
  ollama:
  open-webui:
  pgdata:
  qdrant:
  langfusedb:
