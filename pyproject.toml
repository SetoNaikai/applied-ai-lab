[project]
name = "applied-ai-lab"
version = "0.1.0"
description = "Applied AI engineering portfolio: RAG, evals, agents, fine-tuning"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "tiktoken>=0.8",
    "tenacity>=9.0",
    "rich>=13.9",
    "typer>=0.12",
]

[project.optional-dependencies]
retrieval = ["pymupdf>=1.24", "unstructured>=0.16", "rank-bm25>=0.2"]
evals = ["ragas>=0.2", "deepeval>=1.5", "pandas>=2.2"]
agents = ["langchain>=0.3", "langgraph>=0.2", "mcp>=1.0"]
obs = ["langfuse>=2.53", "mlflow>=2.17"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "projects"]
markers = [
    "slow: excluded from the fast CI subset",
    "costs_money: hits a paid API",
    "eval: part of the eval regression suite",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true
